name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-sanity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate changed Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -t changed_python_files < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- '*.py')
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            mapfile -t changed_python_files < <(git diff --name-only "$BEFORE_SHA...$GITHUB_SHA" -- '*.py')
          else
            mapfile -t changed_python_files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.py')
          fi

          if [ "${#changed_python_files[@]}" -eq 0 ]; then
            echo "No changed Python files to validate."
            exit 0
          fi

          for file in "${changed_python_files[@]}"; do
            if [ -f "$file" ]; then
              echo "Checking syntax: $file"
              python -m py_compile "$file"
            fi
          done
